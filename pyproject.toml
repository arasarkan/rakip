[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rakip"
version = "0.1.0"
description = "Rakip: belirli bir satranç oyuncusu gibi oynayan bot üretir ve benzerliği dürüstçe ölçer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Çekirdek bağımlılıklar hafiftir; yerelde birim testleri bunlarla çalışır.
dependencies = [
  "chess>=1.10",
  "numpy",
  "requests",
]

[project.optional-dependencies]
# Yalnızca Kaggle/Colab'da kurulur. Yerel makinede eğitim yapılmaz.
train = [
  "torch",
  "huggingface-hub>=0.23",
  "onnx",
  "onnxruntime",
  "onnxconverter-common",
]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["rakip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
